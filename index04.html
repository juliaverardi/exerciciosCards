<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>exemploCards</title>
    <link rel="stylesheet" href="css/style04.css" />
  </head>
  <body>
    <section class="main-cards">
      <div class="card">
        <img src="img/camiseta.png" alt="camiseta" />
        <h3>Premium Cotton Shirt</h3>
        <p>Breathable everyday essential</p>
        <p class="estrela">⭐ 4,8 / 2.1K</p>
        <div class="nome">
          <h3 class="preco">$49.99 <span>$69.99</span></h3>
          <button class="btn">🛒</button>
        </div>
      </div>

      <div class="card">
        <img src="img/fone.png" alt="fone" />
        <h3>Studio Headphones</h3>
        <p>Noise canceling- 40h</p>
        <p class="estrela">⭐ 4.8/2.0K</p>
        <div class="nome">
        <h3 class="preco">$149.99 <span>$200.99</span></h3>
        <button class="btn">🛒</button>
        </div>
      </div>

      <div class="card">
        <img src="img/relogio02.png" alt="relogio" />
        <h3>Smart Watch Series 9</h3>
        <p>Noise canceling- 40h</p>
        <p class="estrela">⭐ 4.7/1.9K</p>
        <div class="nome">
        <h3 class="preco">$299.99 <span>$349.90</span></h3>
        <button class="btn">🛒</button>
        </div>
      </div>

      <div class="card">
        <img src="img/tv.png" alt="tv" />
        <h3>UltraGear 4K Monitor</h3>
        <p>Noise canceling- 40h</p>
        <p class="estrela">⭐ 4.7 /1.9K</p>
        <div class="nome">
        <h3 class="preco">$449.99 <span>$559.90</span></h3>
        <button class="btn">🛒</button>
        </div>
      </div>
    </section>
  </body>
</html>
